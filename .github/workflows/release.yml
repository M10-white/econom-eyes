name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build --bundles nsis

      - name: Install rsign2
        run: cargo install rsign2

      - name: Sign updater artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $keyContent = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:TAURI_SIGNING_PRIVATE_KEY))
          Set-Content -Path "signing-key.tmp" -Value $keyContent -NoNewline -Encoding utf8
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $zipPath = $exe.FullName -replace '\.exe$', '.nsis.zip'
          Compress-Archive -Path $exe.FullName -DestinationPath $zipPath
          rsign sign $zipPath -s signing-key.tmp -x "$zipPath.sig" -t "econom-eyes update"
          Remove-Item signing-key.tmp
          Write-Host "Created: $zipPath"
          Write-Host "Signature: $zipPath.sig"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig

      - name: Generate updater JSON
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $zip = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.nsis.zip" | Select-Object -First 1
          $sig = Get-Content "$($zip.FullName).sig" -Raw
          $filename = $zip.Name
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $json = @{
            version = $version
            notes = "Mise a jour v$version"
            pub_date = $date
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig.Trim()
                url = "https://github.com/M10-white/econom-eyes/releases/download/v$version/$filename"
              }
            }
          } | ConvertTo-Json -Depth 4
          $json | Out-File -Encoding utf8 latest.json
          Write-Host "Generated latest.json for v$version"

      - name: Upload updater manifest
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
